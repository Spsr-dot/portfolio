<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <!-- Katana Sword Tip at (3, 3), hilt at (32, 32) diagonally -->
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e8f0"/>
      <stop offset="70%" stop-color="#a0b0c0"/>
      <stop offset="100%" stop-color="#607080"/>
    </linearGradient>
    <filter id="bladeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#ffd1dc" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Blade Edge and Spine -->
  <path d="M 3 3 C 8 7 14 13 22 21 L 20 23 C 12 15 6 9 3 3 Z" fill="url(#bladeGrad)" filter="url(#bladeGlow)"/>
  <!-- Razor sharp cutting edge line -->
  <path d="M 3 3 L 22 21" stroke="#ffffff" stroke-width="0.8"/>
  
  <!-- Habaki (Blade Collar - Gold) -->
  <polygon points="21,19 23,21 21,23 19,21" fill="#d4af37"/>
  
  <!-- Tsuba (Sword Guard - Antique Bronze with gold rim) -->
  <ellipse cx="22" cy="22" rx="4.5" ry="3" transform="rotate(-45 22 22)" fill="#2a1e17" stroke="#d4af37" stroke-width="0.8"/>
  
  <!-- Tsuka (Handle / Hilt with traditional diamond cord wrap) -->
  <line x1="23.5" y1="23.5" x2="32" y2="32" stroke="#141419" stroke-width="3" stroke-linecap="round"/>
  <!-- Gold Menuki and Wrap diamonds -->
  <circle cx="26" cy="26" r="0.8" fill="#d4af37"/>
  <circle cx="29" cy="29" r="0.8" fill="#d4af37"/>
  
  <!-- Kashira (Pommel Cap) -->
  <circle cx="32" cy="32" r="1.5" fill="#d4af37"/>
</svg>

