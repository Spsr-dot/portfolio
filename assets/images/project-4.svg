<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c24"/>
      <stop offset="60%" stop-color="#242c2e"/>
      <stop offset="100%" stop-color="#3d3733"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#p4Sky)"/>

  <!-- Mount Fuji / Mountain silhouette in twilight distance -->
  <path d="M180 340 L 370 140 Q 400 135 430 140 L 620 340 Z" fill="#1b2126"/>
  <path d="M370 140 Q 400 135 430 140 L 450 170 Q 400 185 350 170 Z" fill="#e0e8f0" opacity="0.3"/>

  <!-- Serene Lake reflection and water lilies -->
  <rect y="340" width="800" height="160" fill="#0f1418"/>
  <ellipse cx="250" cy="420" rx="40" ry="10" fill="#19231f"/>
  <ellipse cx="560" cy="400" rx="55" ry="12" fill="#19231f"/>
  <circle cx="560" cy="397" r="5" fill="#fca5a5" opacity="0.8"/>

  <!-- Cherry blossom framing -->
  <path d="M750 40 Q 640 60 560 120" fill="none" stroke="#2a1f18" stroke-width="4"/>
  <circle cx="580" cy="115" r="10" fill="#fca5a5" opacity="0.8"/>
  <circle cx="630" cy="85" r="12" fill="#ffd1dc" opacity="0.85"/>
  <circle cx="680" cy="65" r="9" fill="#f43f5e" opacity="0.75"/>

  <!-- Central Card Overlay with Edit Tag -->
  <rect x="150" y="160" width="500" height="180" rx="10" fill="#13141edd" stroke="#d4af37" stroke-width="1.2"/>
  <rect x="156" y="166" width="488" height="168" rx="8" fill="#1a1b26f2"/>
  
  <rect x="180" y="185" width="30" height="30" rx="4" fill="#a92a2b"/>
  <text x="195" y="206" font-family="serif" font-size="14" font-weight="bold" fill="#fdfbf7" text-anchor="middle">四</text>
  
  <text x="225" y="205" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#fdfbf7" letter-spacing="1">[PROJECT 4 SCREENSHOT]</text>
  <text x="180" y="250" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#d6cebd">Placeholder artwork: Distant Mountain &amp; Reflecting Waters</text>
  <text x="180" y="280" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#a89f8d">To use your own project image, update the &lt;img&gt; tag src in index.html</text>
  <rect x="180" y="300" width="130" height="22" rx="4" fill="#2d2836" stroke="#d4af37" stroke-width="0.8"/>
  <text x="245" y="315" font-family="sans-serif" font-size="10.5" fill="#f5cb5c" text-anchor="middle">Recommended: 800×500px</text>
